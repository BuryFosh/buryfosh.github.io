<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>文章</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="post"></div>

<script>

const params = new URLSearchParams(location.search)
const id = params.get("id")

fetch("posts.json")
.then(res=>res.json())
.then(data=>{

const post = data.find(p=>p.id==id)

document.getElementById("post").innerHTML=`
<h1>${post.title}</h1>
<p>${post.date}</p>
<div>${post.content}</div>
`

})

</script>

</body>
</html>

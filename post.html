<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>文章</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="progress"></div>

<div class="article">

<a class="back" href="index.html">← 返回首页</a>

<h1 id="title"></h1>

<div class="meta">

<span id="date"></span>

<span id="tag"></span>

</div>

<div id="content"></div>

</div>

<script>

const params=new URLSearchParams(location.search)

const id=params.get("id")

fetch("posts.json")

.then(res=>res.json())

.then(posts=>{

const post=posts.find(p=>p.id==id)

document.getElementById("title").innerText=post.title

document.getElementById("date").innerText=post.date

document.getElementById("tag").innerText=post.tag

document.getElementById("content").innerHTML=post.content

})


// 阅读进度条

window.onscroll=()=>{

let h=document.documentElement

let percent=h.scrollTop/(h.scrollHeight-h.clientHeight)

document.querySelector(".progress").style.width=percent*100+"%"

}

</script>

</body>

</html>
